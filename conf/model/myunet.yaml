name: my_unet

# Model parameters
dim: 64 
init_dim: 64 # Initial dimension
out_dim: 1 # Output dimension
dim_mults: [1, 2, 2, 2, 4, 4, 8] # Channel multiplier for each layer
channels: 2 # Input channels
norm: group # Normalization type: batch, instance, group
conv_type: weight_standardized # Convolution type: standard, weight_standardized

init_type: normal # Weight initialization type: normal, xavier, kaiming, orthogonal