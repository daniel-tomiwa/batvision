# Test Settings
mode: test
experiment_name: # Experiment name to load

eval_on: test # Evaluation on 'test' or 'val' set
checkpoints: 50 # Epoch to load
criterion: L1 # Criterion for evaluation
stat_dir: ./eval/ # Folder to save evaluation results

num_threads: 4
batch_size: 1

use_tensorboard: False # Use Tensorboard to display images and loss
use_wandb: False # Use Weights & Biases to log images and loss